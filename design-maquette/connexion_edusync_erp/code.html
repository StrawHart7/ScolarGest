        body {
            background-color: #F8F9FB; /* Custom override as requested, close to surface */

<body class="min-h-screen flex items-center justify-center p-gutter">
<!-- Login Container -->
<main class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl border border-surface-border shadow-sm p-container-padding flex flex-col gap-6">
<!-- Header -->
<header class="flex flex-col items-center text-center gap-4">
<div class="w-16 h-16 rounded-lg bg-surface-container-low flex items-center justify-center text-primary mb-2">
<span aria-hidden="true" class="material-symbols-outlined text-4xl" data-icon="school">school</span>
</div>
<div>
<h1 class="text-display-sm font-display-sm text-text-primary">EduSync ERP</h1>
<p class="text-body-md font-body-md text-text-secondary mt-1">Connexion</p>
</div>
</header>
<!-- Form -->
<form class="flex flex-col gap-5">
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="text-label-md font-label-md text-text-primary" for="email">Adresse e-mail</label>
<input class="h-row-standard px-3 rounded bg-surface-container-lowest border border-surface-border text-body-md font-body-md text-text-primary placeholder:text-on-surface-variant focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="email" name="email" placeholder="nom@institution.edu" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center">
<label class="text-label-md font-label-md text-text-primary" for="password">Mot de passe</label>
<a class="text-label-md font-label-md text-primary hover:text-primary-container transition-colors" href="#">Mot de passe oublié ?</a>
</div>
<input class="h-row-standard px-3 rounded bg-surface-container-lowest border border-surface-border text-body-md font-body-md text-text-primary focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="password" name="password" required="" type="password"/>
</div>
<!-- Primary Action -->
<button class="h-row-standard mt-2 rounded bg-primary text-on-primary text-headline-sm font-headline-sm hover:bg-primary-container transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="submit">
                Se connecter
            </button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-surface-border"></div>
<span class="flex-shrink-0 px-4 text-label-md font-label-md text-text-secondary">ou</span>
<div class="flex-grow border-t border-surface-border"></div>
</div>
<!-- Secondary Action (Google) -->
<button class="h-row-standard rounded bg-surface-container-lowest border border-surface-border text-text-primary text-headline-sm font-headline-sm hover:bg-surface-container-low transition-colors flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-surface-border focus:ring-offset-1" type="button">
<svg aria-hidden="true" class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
            Continuer avec Google
        </button>
</main>
