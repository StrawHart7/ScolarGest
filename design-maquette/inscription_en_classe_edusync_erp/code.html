<body class="antialiased min-h-screen flex">
<!-- Suppressed SideNavBar and TopNavBar as this is a focused/transactional form "dead end" -->
<!-- Main Content Canvas -->

<div class="w-full max-w-2xl bg-surface-container-lowest rounded-xl border border-surface-border shadow-sm flex flex-col">

<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container">

</div>
<div>

<p class="font-body-sm text-body-sm text-text-secondary mt-0.5">Veuillez confirmer les détails d'inscription de l'élève.</p>
</div>
</div>
<button class="text-on-surface-variant hover:bg-surface-container-high p-2 rounded-full transition-colors flex items-center justify-center">

</button>
</div>

</div>
</div>

                </div>
</div>
<!-- Form Body -->

<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Classe Selection -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-text-secondary" for="classe">Sélection de la classe</label>
<div class="relative">
<select class="w-full h-row-standard appearance-none bg-surface-container-lowest border border-surface-border rounded font-body-md text-body-md text-text-primary px-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="classe" name="classe">
<option disabled="" selected="" value="">Choisir une classe</option>
<option value="6a">6ème A</option>
<option value="6b">6ème B</option>
<option value="6c">6ème C</option>
<option value="5a">5ème A</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-text-secondary">
<span class="material-symbols-outlined">arrow_drop_down</span>
</div>
</div>
</div>

<label class="font-label-md text-label-md text-text-secondary" for="regime">Régime</label>

<option value="demi-pensionnaire">Demi-pensionnaire</option>
<option value="interne">Interne</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-text-secondary">
<span class="material-symbols-outlined">arrow_drop_down</span>
</div>
</div>
</div>
</div>

<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-text-secondary" for="frais">Frais d'inscription (FCFA)</label>
<div class="relative flex items-center">
<span class="absolute left-3 text-text-secondary material-symbols-outlined">payments</span>
<input class="w-full h-row-standard bg-surface-container-low border border-surface-border rounded font-data-mono text-data-mono text-text-primary pl-10 pr-3 cursor-not-allowed focus:outline-none" id="frais" name="frais" readonly="" type="text" value="45 000"/>
</div>
<p class="font-body-sm text-body-sm text-text-secondary mt-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">info</span>
                        Montant calculé automatiquement selon le niveau et le régime.
                    </p>
</div>
