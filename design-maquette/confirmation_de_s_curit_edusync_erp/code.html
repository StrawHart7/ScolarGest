<html class="light" lang="fr"><head>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center relative overflow-hidden font-body-md text-on-surface">
<!-- Background Overlay for Modal Context -->
<div class="absolute inset-0 bg-inverse-surface/40 backdrop-blur-sm z-0"></div>
<!-- Main Content Container (Modal) -->
<main class="relative z-10 w-full max-w-md px-container-padding">
<div class="bg-surface-container-lowest rounded-xl shadow-lg border border-surface-border p-8 flex flex-col gap-6">
<!-- Header Section -->
<header class="flex flex-col items-center text-center gap-4">
<div class="w-16 h-16 rounded-full bg-primary-container/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-4xl" data-icon="lock" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<div>
<h1 class="text-display-sm font-display-sm text-text-primary mb-2">Confirmation requise</h1>
<p class="text-body-md font-body-md text-text-secondary">
                        Veuillez saisir votre mot de passe administrateur pour confirmer la validation de :<br/>
<strong class="text-on-surface mt-1 block font-semibold">Validation de notes - Terminale A</strong>
</p>
</div>
</header>
<!-- Form Section -->
<form action="#" class="flex flex-col gap-6" method="POST" onsubmit="event.preventDefault(); window.location.href='#';">
<div class="flex flex-col gap-2 relative">
<label class="text-label-md font-label-md text-text-secondary" for="admin-password">Mot de passe administrateur</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="key">key</span>
<input class="w-full pl-10 pr-10 h-row-standard bg-surface-container-lowest border border-surface-border rounded-lg text-body-md font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="admin-password" name="admin-password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="visibility-icon">visibility</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col-reverse sm:flex-row gap-3 sm:justify-end mt-2">
<button class="h-row-standard px-6 rounded-lg text-label-md font-label-md text-on-surface-variant hover:bg-surface-container-high transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="button">
                        Annuler
                    </button>
<button class="h-row-standard px-6 rounded-lg bg-primary text-on-primary text-label-md font-label-md flex items-center justify-center gap-2 hover:bg-on-primary-fixed-variant transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="submit">
<span class="material-symbols-outlined text-[18px]" data-icon="check_circle">check_circle</span>
                        Confirmer
                    </button>
</div>
</form>
<!-- Security Footnote -->
<div class="mt-2 text-center flex items-center justify-center gap-2 text-text-secondary">
<span class="material-symbols-outlined text-[16px]" data-icon="shield">shield</span>
<span class="text-body-sm font-body-sm">Action sécurisée via EduSync Auth</span>
</div>
</div>
</main>
<script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('admin-password');
            const visibilityIcon = document.getElementById('visibility-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility_off';
                visibilityIcon.setAttribute('data-icon', 'visibility_off');
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility';
                visibilityIcon.setAttribute('data-icon', 'visibility');
            }
        }
    </script>
</body></html>
