<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .fill-icon {
            font-variation-settings: 'FILL' 1;
        }

<body class="bg-background min-h-screen text-text-primary overflow-hidden">
<!-- Modal Overlay -->
<div class="fixed inset-0 bg-inverse-surface/60 backdrop-blur-sm z-50 flex items-center justify-center p-gutter">
<!-- Modal Content -->
<div class="bg-surface-container-lowest w-full max-w-md rounded-xl shadow-lg border border-surface-border overflow-hidden">
<!-- Modal Header -->
<div class="px-container-padding py-gutter border-b border-surface-border bg-surface-container-low flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container text-primary flex items-center justify-center shrink-0">
<span class="material-symbols-outlined fill-icon text-xl" data-icon="lock_person">lock_person</span>
</div>
<div>
<h2 class="text-headline-md font-headline-md text-primary">Approbation Sécurisée</h2>
<p class="text-body-sm font-body-sm text-text-secondary mt-0.5">Validation finale requise</p>
</div>
</div>
<!-- Modal Body -->
<div class="px-container-padding py-6">
<p class="text-body-md font-body-md text-on-surface mb-6 leading-relaxed">
                    Confirmation requise pour approuver les notes de <span class="font-bold text-primary">Terminale S - Mathématiques (Semestre 2)</span>. Cette action est définitive.
                </p>
<div class="space-y-4">
<div>
<label class="block text-label-md font-label-md text-text-secondary mb-2" for="admin-password">
                            Mot de passe administrateur
                        </label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-surface-border rounded-lg h-row-standard px-3 text-body-md font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="admin-password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-text-secondary hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Security Notice -->
<div class="flex items-start gap-2 p-3 bg-surface-container rounded-lg border border-surface-border">
<span class="material-symbols-outlined text-text-secondary text-[16px] mt-0.5" data-icon="verified_user">verified_user</span>
<p class="text-body-sm font-body-sm text-text-secondary">
                            Cette action sera enregistrée dans le journal d'audit de l'établissement sous votre identifiant.
                        </p>
</div>
</div>
</div>
<!-- Modal Footer -->
<div class="px-container-padding py-gutter border-t border-surface-border bg-surface flex justify-end gap-3">
<button class="h-row-standard px-4 rounded-lg border border-surface-border bg-surface-container-lowest text-text-primary text-label-md font-label-md hover:bg-surface-container-low transition-colors" type="button">
                    Annuler
                </button>
<button class="h-row-standard px-6 rounded-lg bg-primary text-on-primary text-label-md font-label-md hover:bg-primary-container hover:text-on-primary-container transition-colors shadow-sm flex items-center gap-2" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="check_circle">check_circle</span>
                    Confirmer l'approbation
                </button>
</div>
</div>
</div>
</body></html>
